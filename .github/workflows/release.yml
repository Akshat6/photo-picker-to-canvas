name: Publish Obsidian plugin release

on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate manifest
        id: manifest
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json')); if (!/^\d+\.\d+\.\d+$/.test(m.version) || !m.id || !m.minAppVersion) process.exit(1);"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with plugin files
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" manifest.json main.js styles.css \
            --target "$GITHUB_SHA" \
            --title "Photo Picker to Canvas $VERSION" \
            --notes "Experimental Android beta. Back up your Obsidian vault before installing."
